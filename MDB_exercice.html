<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F5F0E8">
<title>MDB — Exercice</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ivoire:#F5F0E8; --ivoire-soft:#FAF6F0; --ivoire-deep:#EDE6DA;
  --brun-noir:#1A1410; --ambre:#C86030; --ambre-deep:#A04820;
  --or:#C9A84C; --or-light:#D4B86A; --or-deep:#A88830;
  --mauve:#9A8090; --taupe:#B0A090; --taupe-light:#C8BEB0; --taupe-deep:#8A7A68;
  --texte:#1A1410; --texte-secondaire:#5A4A40; --texte-tertiaire:#8A7A68;
}
body{font-family:'Be Vietnam Pro',sans-serif;background:var(--ivoire);color:var(--texte);min-height:100vh;padding-bottom:80px;-webkit-font-smoothing:antialiased}

.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:0.5px solid var(--ivoire-deep);padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
.topbar-brand{font-family:'Playfair Display',serif;font-size:15px;color:var(--brun-noir)}
.topbar-brand em{font-style:italic;font-weight:400}
.topbar-brand strong{font-weight:800;font-family:'Be Vietnam Pro',sans-serif}
.topbar-back{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--texte-secondaire);padding:8px 14px;border-radius:999px;background:var(--ivoire-soft);border:0.5px solid var(--ivoire-deep);text-decoration:none;transition:all .2s;cursor:pointer}
.topbar-back:hover{border-color:var(--taupe);color:var(--brun-noir)}

.wrap{max-width:720px;margin:0 auto;padding:32px 20px;position:relative}

.eyebrow{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:var(--ambre);margin-bottom:14px}
.eyebrow .sep{color:var(--taupe);margin:0 8px;font-weight:400}

h1.titre{font-family:'Playfair Display',serif;font-size:28px;font-weight:600;color:var(--brun-noir);line-height:1.25;margin-bottom:12px}
p.subtitle{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:var(--texte-secondaire);line-height:1.55;margin-bottom:32px}

/* MEDIA CARD (video/eft/meditation/hypnose) */
.media-card{background:#1A1410;border-radius:20px;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;margin-bottom:24px;box-shadow:0 8px 28px rgba(26,20,16,0.12)}
.media-card::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(200,96,48,0.22) 0%,transparent 60%)}
.media-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:14px}
.play-btn{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--ambre),var(--ambre-deep));display:flex;align-items:center;justify-content:center;box-shadow:0 6px 28px rgba(200,96,48,0.45);cursor:pointer;transition:transform .2s}
.play-btn:hover{transform:scale(1.06)}
.media-label{font-family:'Playfair Display',serif;font-size:16px;color:#fff;opacity:.85}
.media-meta{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;color:rgba(255,255,255,0.6)}

/* PDF CARD */
.pdf-card{background:#fff;border-radius:20px;padding:32px 28px;border:0.5px solid var(--ivoire-deep);box-shadow:0 1px 3px rgba(26,20,16,0.03);text-align:center;margin-bottom:24px}
.pdf-icon{width:64px;height:64px;border-radius:16px;background:rgba(201,168,76,0.12);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:28px}
.pdf-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:600;color:var(--brun-noir);margin-bottom:8px}
.pdf-desc{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:var(--texte-secondaire);margin-bottom:20px}

/* INTRO/JOURNAL */
.jour-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px}
.jour-tab{padding:8px 14px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;border:0.5px solid var(--ivoire-deep);color:var(--texte-secondaire);background:#fff;transition:all .2s}
.jour-tab:hover{border-color:var(--taupe-light)}
.jour-tab.on{background:var(--brun-noir);color:#fff;border-color:var(--brun-noir)}
.jour-tab.done{background:rgba(201,168,76,0.14);border-color:var(--or);color:var(--or-deep)}
.jour-tab.done.on{background:var(--brun-noir);color:#fff}

.jour-content{display:none}
.jour-content.on{display:block}
.jour-card{background:#fff;border-radius:18px;padding:24px 22px;border:0.5px solid var(--ivoire-deep);box-shadow:0 1px 3px rgba(26,20,16,0.03);margin-bottom:18px}
.jour-label{font-size:11px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--ambre);margin-bottom:18px}

.field{margin-bottom:18px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--brun-noir);margin-bottom:8px}
.field label em{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:14px;color:var(--texte-secondaire);margin-left:4px}
textarea,input[type=text]{width:100%;background:var(--ivoire-soft);border:1px solid var(--ivoire-deep);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--brun-noir);font-family:'Be Vietnam Pro',sans-serif;resize:vertical;outline:none;line-height:1.6;transition:all .2s}
textarea{min-height:90px}
textarea:focus,input[type=text]:focus{border-color:var(--taupe);background:#fff}
textarea::placeholder,input[type=text]::placeholder{color:var(--texte-tertiaire);font-style:italic}

/* BUTTONS */
.actions{display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap}
.btn-or{background:var(--or);color:var(--brun-noir);border:none;padding:13px 22px;border-radius:12px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:'Be Vietnam Pro',sans-serif;transition:all .2s;display:inline-flex;align-items:center;gap:8px}
.btn-or:hover{background:var(--or-light);transform:translateY(-1px);box-shadow:0 6px 18px rgba(201,168,76,0.3)}
.btn-ghost{background:transparent;border:1px solid var(--taupe-light);color:var(--texte-secondaire);padding:13px 22px;border-radius:12px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:'Be Vietnam Pro',sans-serif;transition:all .2s}
.btn-ghost:hover{border-color:var(--taupe-deep);color:var(--brun-noir)}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--brun-noir);color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(26,20,16,0.25);opacity:0;transition:all .3s;z-index:50;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.err{background:var(--ambre-deep)}

@media (max-width:500px){
  h1.titre{font-size:24px}
  p.subtitle{font-size:15px}
  .topbar{padding:12px 16px}
  .topbar-brand{font-size:13px}
  .wrap{padding:24px 16px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand"><em>Mindset</em> <strong>du bien-être.</strong></div>
  <a class="topbar-back" href="MDB_membre_A.html">← Retour au tableau de bord</a>
</div>

<div class="wrap">
  <div class="eyebrow" id="eyebrow">Exercice <span class="sep">·</span> Semaine 1</div>
  <h1 class="titre" id="titre">Exercice</h1>
  <p class="subtitle" id="subtitle">Prends un moment pour toi.</p>

  <!-- MEDIA VIEW (video/eft/meditation/hypnose) -->
  <div id="view-media" style="display:none">
    <div class="media-card">
      <div class="media-inner">
        <div class="play-btn" onclick="showToast('Lecture bientôt disponible')">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><polygon points="6,3 21,12 6,21" fill="#fff"/></svg>
        </div>
        <div class="media-label" id="media-label">Vidéo</div>
        <div class="media-meta" id="media-meta">à venir</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn-or" onclick="marquerTermine()">Marquer comme terminé
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 8l4 4 6-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <!-- PDF VIEW -->
  <div id="view-pdf" style="display:none">
    <div class="pdf-card">
      <div class="pdf-icon">📄</div>
      <div class="pdf-title" id="pdf-title">Ressource PDF</div>
      <div class="pdf-desc">À garder précieusement. À imprimer ou consulter sur ton téléphone.</div>
      <div class="actions">
        <button class="btn-or" onclick="telechargerPDF()">Télécharger le PDF</button>
        <button class="btn-ghost" onclick="marquerTermine()">Marquer comme lu</button>
      </div>
    </div>
  </div>

  <!-- INTRO / JOURNAL VIEW -->
  <div id="view-intro" style="display:none">
    <div class="jour-tabs" id="jour-tabs"></div>
    <div id="jour-contents"></div>
    <div class="actions">
      <button class="btn-ghost" onclick="sauvegarder(false)">Enregistrer</button>
      <button class="btn-or" onclick="marquerTermine()">Marquer comme terminé
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 8l4 4 6-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://hzirvgssahyoxxopowjr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh6aXJ2Z3NzYWh5b3h4b3Bvd2pyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0OTEzMjMsImV4cCI6MjA5MDA2NzMyM30.9BOdDoAxKS_mn4CZ9E8YN3eZmkV388U0lZW_st1Jep0';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const clienteId = localStorage.getItem('mdb_cliente_id');
if (!clienteId) window.location.href = 'index.html';

const qs = new URLSearchParams(window.location.search);
const type = qs.get('type') || 'video';
const slug = qs.get('slug') || '';
const titreParam = decodeURIComponent(qs.get('titre') || 'Exercice');
const semaine = parseInt(qs.get('semaine') || '1', 10);
const urlPdf = qs.get('url_pdf') || '';

let jourActif = 1;

// ── TYPE LABELS ──
const typeLabels = {
  video: 'Vidéo thérapeutique',
  eft: 'EFT · Tapping guidé',
  meditation: 'Méditation guidée',
  hypnose: 'Auto-hypnose',
  pdf: 'Ressource PDF',
  introspection: 'Introspection écrite',
  journal: 'Journal quotidien'
};

// ── INIT HEADER ──
document.getElementById('titre').textContent = titreParam;
document.getElementById('eyebrow').innerHTML = (typeLabels[type] || 'Exercice') + ' <span class="sep">·</span> Semaine ' + semaine;

// ── SUBTITLES ──
const subtitles = {
  video: 'Installe-toi confortablement. Offre-toi cette pause.',
  eft: 'Pose tes doigts, suis la séquence, accueille ce qui remonte.',
  meditation: 'Ferme les yeux. Respire. Laisse la voix te guider.',
  hypnose: 'Un moment pour descendre en toi. Sans effort.',
  pdf: 'Une ressource à garder. À relire quand tu en as besoin.',
  introspection: 'Un espace d\'écriture pour toi. Sans jugement.',
  journal: 'Sept jours d\'écoute de toi-même.'
};
document.getElementById('subtitle').textContent = subtitles[type] || 'Prends un moment pour toi.';

// ── MEDIA LABELS ──
if (['video','eft','meditation','hypnose'].includes(type)) {
  document.getElementById('view-media').style.display = 'block';
  document.getElementById('media-label').textContent = titreParam;
  document.getElementById('media-meta').textContent = 'Phase 1 · Semaine ' + semaine;
} else if (type === 'pdf') {
  document.getElementById('view-pdf').style.display = 'block';
  document.getElementById('pdf-title').textContent = titreParam;
} else if (type === 'introspection' || type === 'journal') {
  document.getElementById('view-intro').style.display = 'block';
  buildJours();
  loadReponses();
}

// ── BUILD JOURS ──
function buildJours() {
  const labels = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  const fullLabels = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
  const tabs = document.getElementById('jour-tabs');
  const contents = document.getElementById('jour-contents');
  let tabsHtml = '', contentsHtml = '';
  for (let i = 1; i <= 7; i++) {
    tabsHtml += `<div class="jour-tab${i===1?' on':''}" onclick="switchJour(${i},this)">${labels[i-1]}</div>`;
    contentsHtml += `
      <div class="jour-content${i===1?' on':''}" id="jour-${i}">
        <div class="jour-card">
          <div class="jour-label">${fullLabels[i-1]} · Jour ${i}</div>
          <div class="field">
            <label>Décharge <em>— ce qui pèse, sans filtre</em></label>
            <textarea id="decharge_j${i}" rows="5" placeholder="Vide tout ici..."></textarea>
          </div>
          <div class="field">
            <label>Dans mon corps <em>— les sensations physiques</em></label>
            <input type="text" id="corps_j${i}" placeholder="Gorge serrée, ventre noué, épaules lourdes...">
          </div>
          <div class="field">
            <label>Émotion dominante <em>— en un mot</em></label>
            <input type="text" id="emotion_j${i}" placeholder="Anxiété, fatigue, colère, tristesse...">
          </div>
          <div class="field">
            <label>Ancrage 1 <em>— une chose qui fonctionne dans ma vie</em></label>
            <textarea id="ancrage1_j${i}" rows="2" placeholder="..."></textarea>
          </div>
          <div class="field">
            <label>Ancrage 2 <em>— une chose que je me reconnais aujourd'hui</em></label>
            <textarea id="ancrage2_j${i}" rows="2" placeholder="..."></textarea>
          </div>
        </div>
      </div>`;
  }
  tabs.innerHTML = tabsHtml;
  contents.innerHTML = contentsHtml;
}

function switchJour(num, el) {
  document.querySelectorAll('.jour-content').forEach(j => j.classList.remove('on'));
  document.querySelectorAll('.jour-tab').forEach(t => t.classList.remove('on'));
  const c = document.getElementById('jour-' + num);
  if (c) c.classList.add('on');
  if (el) el.classList.add('on');
  jourActif = num;
}

// ── LOAD REPONSES ──
async function loadReponses() {
  try {
    const { data, error } = await sb.from('reponses_introspection')
      .select('*').eq('cliente_id', clienteId).eq('exercice_slug', slug).maybeSingle();
    if (error) { console.warn('Load:', error); return; }
    if (data && data.reponses) {
      const r = data.reponses;
      Object.keys(r).forEach(k => {
        const el = document.getElementById(k);
        if (el) el.value = r[k] || '';
      });
      // mark completed days
      for (let i = 1; i <= 7; i++) {
        if (r['decharge_j'+i] && r['decharge_j'+i].trim().length > 0) {
          const tab = document.querySelectorAll('.jour-tab')[i-1];
          if (tab) tab.classList.add('done');
        }
      }
    }
  } catch(e) { console.warn('Load err:', e); }
}

// ── COLLECT REPONSES ──
function collectReponses() {
  const r = {};
  const keys = ['decharge','corps','emotion','ancrage1','ancrage2'];
  for (let i = 1; i <= 7; i++) {
    keys.forEach(k => {
      const el = document.getElementById(k + '_j' + i);
      if (el && el.value) r[k + '_j' + i] = el.value;
    });
  }
  return r;
}

// ── SAUVEGARDER ──
async function sauvegarder(silent) {
  if (type !== 'introspection' && type !== 'journal') return true;
  const reponses = collectReponses();
  try {
    const { error } = await sb.from('reponses_introspection').upsert({
      cliente_id: clienteId,
      exercice_slug: slug,
      exercice_titre: titreParam,
      semaine: semaine,
      reponses: reponses,
      updated_at: new Date().toISOString()
    }, { onConflict: 'cliente_id,exercice_slug' });
    if (error) { showToast('Erreur de sauvegarde', true); return false; }
    if (!silent) showToast('Enregistré');
    // mark done tabs
    for (let i = 1; i <= 7; i++) {
      if (reponses['decharge_j'+i] && reponses['decharge_j'+i].trim().length > 0) {
        const tab = document.querySelectorAll('.jour-tab')[i-1];
        if (tab) tab.classList.add('done');
      }
    }
    return true;
  } catch(e) { showToast('Erreur de sauvegarde', true); return false; }
}

// ── MARQUER COMPLETÉ ──
async function marquerComplete() {
  try {
    const { error } = await sb.from('exercices_completes').upsert({
      cliente_id: clienteId,
      activite_slug: slug,
      activite_type: type,
      semaine: semaine
    }, { onConflict: 'cliente_id,activite_slug' });
    if (error) console.warn('Complete:', error);
  } catch(e) { console.warn('Complete err:', e); }
}

// ── MARQUER TERMINÉ ──
async function marquerTermine() {
  if (type === 'introspection' || type === 'journal') {
    const ok = await sauvegarder(true);
    if (!ok) return;
  }
  await marquerComplete();
  showToast('Terminé ✓');
  setTimeout(() => { window.location.href = 'MDB_membre_A.html'; }, 900);
}

// ── PDF ──
async function telechargerPDF() {
  if (urlPdf) {
    window.open(urlPdf, '_blank');
  } else {
    showToast('Bientôt disponible');
  }
}

// ── TOAST ──
function showToast(msg, err) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('err', !!err);
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}
</script>
</body>
</html>
