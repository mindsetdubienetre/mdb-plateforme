<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MDB — Connexion</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --noir:#0f0d0b;--orange:#d06224;--brique:#af421c;--or:#b8a465;
  --sauge:#7a9e8e;--sauge-mid:#5a826f;
  --texte-muted:#6b6560;--texte-dim:rgba(255,255,255,0.22);
  --card:#ffffff;--card-border:rgba(255,255,255,0.09)
}
html,body{height:100%;overflow:hidden}
body{font-family:'Be Vietnam Pro',sans-serif;background:var(--noir);color:#fff;display:flex;align-items:center;justify-content:center}

body::before{content:'';position:fixed;top:-100px;right:-100px;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(208,98,36,0.12) 0%,transparent 65%);pointer-events:none}
body::after{content:'';position:fixed;bottom:-100px;left:-80px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(122,158,142,0.1) 0%,transparent 65%);pointer-events:none}

.card{background:#ffffff;border:0.5px solid rgba(122,158,142,0.2);border-radius:20px;padding:40px 36px;width:100%;max-width:420px;position:relative;z-index:1}

/* LOGO */
.logo-row{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:32px}
.orb-wrap{position:relative;width:40px;height:40px}
.orb-glow{position:absolute;inset:-8px;border-radius:50%;background:radial-gradient(circle,rgba(245,166,35,0.22) 0%,transparent 70%)}
.orb{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 38% 35%,#f08060,#d06224 55%,#af421c)}
.logo-texts .l1{font-family:'Playfair Display',serif;font-style:italic;font-size:18px;color:#fff;line-height:1.1}
.logo-texts .l2{font-size:9px;font-weight:600;color:rgba(255,255,255,0.35);letter-spacing:0.18em;text-transform:uppercase;margin-top:2px}
.logo-texts .l3{font-size:8px;color:rgba(255,255,255,0.2);letter-spacing:0.22em;border-top:0.5px solid rgba(255,255,255,0.1);padding-top:2px;margin-top:2px}

/* HEADER */
.card-title{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;text-align:center;margin-bottom:6px}
.card-sub{font-family:'Playfair Display',serif;font-style:italic;font-size:14px;color:var(--texte-muted);text-align:center;margin-bottom:28px;line-height:1.5}

/* TABS */
.tabs{display:flex;background:rgba(122,158,142,0.12);border-radius:20px;padding:3px;gap:2px;margin-bottom:24px}
.tab{flex:1;padding:8px;border-radius:16px;font-size:12.5px;font-weight:500;text-align:center;cursor:pointer;color:var(--texte-muted);transition:all 0.2s}
.tab.on{background:rgba(208,98,36,0.18);color:var(--orange);border:0.5px solid rgba(208,98,36,0.3)}

/* FORM */
.field{margin-bottom:14px}
.field-label{font-size:11px;font-weight:600;color:var(--texte-muted);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:6px}
.field-input{width:100%;background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.12);border-radius:10px;padding:12px 14px;font-size:13.5px;color:#fff;font-family:'Be Vietnam Pro',sans-serif;outline:none;transition:all 0.2s}
.field-input:focus{border-color:rgba(208,98,36,0.4);background:rgba(208,98,36,0.05)}
.field-input::placeholder{color:rgba(255,255,255,0.2)}
.field-input.code{font-family:'Playfair Display',serif;font-size:16px;letter-spacing:0.1em;text-align:center;text-transform:uppercase}

.btn-main{width:100%;background:linear-gradient(135deg,var(--brique),var(--orange));color:#fff;border:none;padding:14px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Be Vietnam Pro',sans-serif;box-shadow:0 4px 20px rgba(208,98,36,0.3);transition:all 0.2s;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-main:hover{transform:translateY(-1px);box-shadow:0 6px 26px rgba(208,98,36,0.4)}
.btn-main:disabled{opacity:0.5;cursor:not-allowed;transform:none}

/* MESSAGE */
.msg{padding:10px 14px;border-radius:10px;font-size:12.5px;margin-bottom:14px;line-height:1.5;display:none}
.msg.error{background:rgba(192,57,43,0.12);border:0.5px solid rgba(192,57,43,0.3);color:#e07070}
.msg.success{background:rgba(122,158,142,0.12);border:0.5px solid rgba(122,158,142,0.3);color:var(--sauge)}

/* FOOTER */
.card-footer{text-align:center;margin-top:20px;font-size:12px;color:var(--texte-dim);line-height:1.7}
.card-footer a{color:var(--sauge);cursor:pointer}

/* LOADING */
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="card">
  <!-- LOGO -->
  <div class="logo-row">
    <div class="orb-wrap">
      <div class="orb-glow"></div>
      <div class="orb"></div>
    </div>
    <div class="logo-texts">
      <div class="l1">Mindset</div>
      <div class="l2">du bien-être.</div>
      <div class="l3">M · D · B</div>
    </div>
  </div>

  <div class="card-title">Bienvenue</div>
  <div class="card-sub">Ton espace de transformation t'attend.</div>

  <!-- TABS -->
  <div class="tabs">
    <div class="tab on" onclick="switchTab('email',this)">Connexion email</div>
    <div class="tab" onclick="switchTab('code',this)">Code d'accès</div>
  </div>

  <!-- MESSAGE -->
  <div class="msg" id="msg"></div>

  <!-- FORM EMAIL -->
  <div id="form-email">
    <div class="field">
      <div class="field-label">Email</div>
      <input class="field-input" type="email" id="email-input" placeholder="ton@email.com"/>
    </div>
    <div class="field">
      <div class="field-label">Mot de passe</div>
      <input class="field-input" type="password" id="password-input" placeholder="••••••••"/>
    </div>
    <button class="btn-main" id="btn-email" onclick="loginEmail()">
      Accéder à mon espace
    </button>
  </div>

  <!-- FORM CODE -->
  <div id="form-code" style="display:none">
    <div class="field">
      <div class="field-label">Ton code d'accès MDB</div>
      <input class="field-input code" type="text" id="code-input" placeholder="MDB-2026-XXX" maxlength="15"/>
      <div style="font-size:11px;color:var(--texte-dim);margin-top:6px">Tu as reçu ce code par email après ton inscription.</div>
    </div>
    <div class="field">
      <div class="field-label">Email</div>
      <input class="field-input" type="email" id="code-email-input" placeholder="ton@email.com"/>
    </div>
    <button class="btn-main" id="btn-code" onclick="loginCode()">
      Accéder à mon espace
    </button>
  </div>

  <div class="card-footer">
    Tu n'as pas encore accès ? <a onclick="contactVanille()">Contacter Vanille</a><br>
    <span style="font-size:11px;opacity:0.6">Ton espace est sécurisé et confidentiel.</span>
  </div>
</div>

<script>
  // ══════════════════════════════════════════
  // CONFIGURATION SUPABASE
  // Remplace ces valeurs par les tiennes
  // ══════════════════════════════════════════
  const SUPABASE_URL = 'https://hzirvgssahyoxxopowjr.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh6aXJ2Z3NzYWh5b3h4b3Bvd2pyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0OTEzMjMsImV4cCI6MjA5MDA2NzMyM30.9BOdDoAxKS_mn4CZ9E8YN3eZmkV388U0lZW_st1Jep0';
  
  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function switchTab(type, el){
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
    el.classList.add('on');
    document.getElementById('form-email').style.display = type==='email' ? 'block' : 'none';
    document.getElementById('form-code').style.display = type==='code' ? 'block' : 'none';
    hideMsg();
  }

  function showMsg(text, type){
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = `msg ${type}`;
    el.style.display = 'block';
  }

  function hideMsg(){
    document.getElementById('msg').style.display = 'none';
  }

  function setLoading(btnId, loading){
    const btn = document.getElementById(btnId);
    if(loading){
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div>';
    } else {
      btn.disabled = false;
      btn.innerHTML = 'Accéder à mon espace';
    }
  }

  async function loginEmail(){
    const email = document.getElementById('email-input').value.trim();
    const password = document.getElementById('password-input').value;
    if(!email || !password){ showMsg('Remplis tous les champs.','error'); return; }
    setLoading('btn-email', true);
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ showMsg('Email ou mot de passe incorrect.','error'); setLoading('btn-email',false); return; }
    const { data: cliente } = await sb.from('clientes').select('*').eq('email', email).single();
    if(!cliente){ showMsg('Compte introuvable. Contacte Vanille.','error'); setLoading('btn-email',false); return; }
    if(cliente.onboarding_complete){
      window.location.href = 'MDB_membre_A.html';
    } else {
      window.location.href = 'MDB_onboarding.html';
    }
  }

  async function loginCode(){
    const code = document.getElementById('code-input').value.trim().toUpperCase();
    const email = document.getElementById('code-email-input').value.trim();
    if(!code || !email){ showMsg('Remplis tous les champs.','error'); return; }
    setLoading('btn-code', true);
    const { data: cliente, error } = await sb
      .from('clientes')
      .select('*')
      .eq('code_acces', code)
      .eq('email', email)
      .single();
    if(error || !cliente){ showMsg('Code ou email incorrect. Vérifie ton email de bienvenue.','error'); setLoading('btn-code',false); return; }
    if(!cliente.actif){ showMsg('Ton accès est temporairement suspendu. Contacte Vanille.','error'); setLoading('btn-code',false); return; }
    localStorage.setItem('mdb_cliente_id', cliente.id);
    localStorage.setItem('mdb_cliente_prenom', cliente.prenom);
    await sb.from('clientes').update({ derniere_connexion: new Date().toISOString() }).eq('id', cliente.id);
    showMsg(`Bienvenue ${cliente.prenom} ✦ Redirection en cours...`, 'success');
    setTimeout(()=>{
      window.location.href = cliente.onboarding_complete ? 'MDB_membre_A.html' : 'MDB_onboarding.html';
    }, 1500);
  }

  function contactVanille(){
    window.open('mailto:vanille@mindsetdubienetre.com?subject=Accès plateforme MDB','_blank');
  }

  // Auto-format code
  document.addEventListener('DOMContentLoaded', ()=>{
    const codeInput = document.getElementById('code-input');
    if(codeInput){
      codeInput.addEventListener('input', (e)=>{
        let val = e.target.value.replace(/[^A-Z0-9]/gi,'').toUpperCase();
        if(val.length > 3 && val[3] !== '-') val = val.slice(0,3)+'-'+val.slice(3);
        if(val.length > 8 && val[8] !== '-') val = val.slice(0,8)+'-'+val.slice(8);
        e.target.value = val;
      });
    }
  });
</script>
</body>
</html>
