<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MDB — Cohérence cardiaque</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Be+Vietnam+Pro:wght@300;400;500;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/mdb.css">
<style>
  body { background: linear-gradient(180deg, var(--brun-noir) 0%, #0E0A07 100%); color: var(--ivoire); min-height: 100vh; overflow: hidden; }
  .topbar { padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; }
  .back-btn { color: var(--ivoire); display: flex; align-items: center; gap: 8px; font-size: 13px; opacity: 0.7; }
  .protocol-name { font-family: 'Playfair Display', serif; font-style: italic; font-size: 14px; color: var(--taupe); }

  .container-page { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: calc(100vh - 80px); padding: 20px; }

  .header { text-align: center; margin-bottom: 48px; }
  .header-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ambre); margin-bottom: 12px; }
  .header-title { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 700; line-height: 1.2; margin-bottom: 12px; }
  .header-title em { font-style: italic; color: var(--ambre); }
  .header-sub { font-family: 'Playfair Display', serif; font-style: italic; font-size: 15px; color: var(--taupe); }

  /* CERCLE QUI RESPIRE */
  .breath-stage {
    position: relative;
    width: 320px;
    height: 320px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 40px;
  }

  .breath-glow {
    position: absolute;
    inset: -40px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(200,96,48,0.2) 0%, transparent 60%);
    animation: glow 10s ease-in-out infinite;
  }
  @keyframes glow {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.2); opacity: 0.8; }
  }

  .breath-circle {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 38%, #E08858, #D06030, #B04018);
    box-shadow: 0 0 40px rgba(200,96,48,0.4), 0 0 100px rgba(154,128,144,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: breathe 10s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.4); }
  }

  .breath-text {
    text-align: center;
    color: #fff;
  }
  .breath-instruction {
    font-family: 'Playfair Display', serif;
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 4px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .breath-counter {
    font-family: 'Cormorant Garamond', serif;
    font-size: 36px;
    font-weight: 300;
    line-height: 1;
  }

  /* PROGRESSION CYCLE */
  .cycle-info {
    display: flex;
    align-items: center;
    gap: 24px;
    margin-bottom: 32px;
  }
  .cycle-stat { text-align: center; }
  .cycle-stat-val { font-family: 'Cormorant Garamond', serif; font-size: 28px; line-height: 1; color: var(--or); font-weight: 600; }
  .cycle-stat-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--taupe); margin-top: 4px; }
  .cycle-divider { width: 1px; height: 32px; background: rgba(255,255,255,0.15); }

  /* CONTROLS */
  .controls { display: flex; gap: 12px; margin-bottom: 24px; }
  .control-btn {
    background: rgba(255,255,255,0.08);
    color: var(--ivoire);
    width: 56px; height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255,255,255,0.1);
    transition: var(--transition);
  }
  .control-btn:hover { background: rgba(255,255,255,0.15); }
  .control-btn.primary { background: var(--or); color: var(--brun-noir); border-color: var(--or); width: 72px; height: 72px; box-shadow: var(--shadow-glow-or); }

  /* PROTOCOL SELECTOR */
  .protocols { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 360px; }
  .proto {
    padding: 8px 14px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: var(--radius-full);
    font-size: 11px;
    color: var(--taupe);
    cursor: pointer;
    transition: var(--transition);
  }
  .proto.active { background: var(--ambre); color: #fff; border-color: var(--ambre); }
</style>
</head>
<body>
  <div class="topbar">
    <a href="javascript:history.back()" class="back-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 6L9 12L15 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Retour
    </a>
    <div class="protocol-name">Cohérence cardiaque · 5-5-5</div>
  </div>

  <a href="index.html" style="position: fixed; top: 12px; right: 12px; font-size: 11px; color: var(--ivoire); padding: 6px 12px; background: rgba(255,255,255,0.1); backdrop-filter: blur(8px); border-radius: var(--radius-full); z-index: 100;">← maquettes</a>

  <div class="container-page">
    <div class="header">
      <div class="header-eyebrow">Respiration guidée</div>
      <h1 class="header-title">Suis le <em>cercle</em>.</h1>
      <p class="header-sub">5 secondes pour inspirer · 5 secondes pour expirer.</p>
    </div>

    <div class="breath-stage">
      <div class="breath-glow"></div>
      <div class="breath-circle">
        <div class="breath-text">
          <div class="breath-instruction" id="instruction">Inspire</div>
          <div class="breath-counter" id="counter">5</div>
        </div>
      </div>
    </div>

    <div class="cycle-info">
      <div class="cycle-stat">
        <div class="cycle-stat-val">3</div>
        <div class="cycle-stat-label">Cycle</div>
      </div>
      <div class="cycle-divider"></div>
      <div class="cycle-stat">
        <div class="cycle-stat-val">2:30</div>
        <div class="cycle-stat-label">Restant</div>
      </div>
      <div class="cycle-divider"></div>
      <div class="cycle-stat">
        <div class="cycle-stat-val">5</div>
        <div class="cycle-stat-label">Min</div>
      </div>
    </div>

    <div class="controls">
      <button class="control-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M19 12H5 M12 5L5 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="control-btn primary">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      </button>
      <button class="control-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 12H19 M12 5L19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="protocols">
      <div class="proto active">5-5-5 · cohérence</div>
      <div class="proto">4-7-8 · apaisement</div>
      <div class="proto">Carrée · 4-4-4-4</div>
      <div class="proto">Activation · 6-2-4</div>
    </div>
  </div>

  <script>
    let phase = 'inspire';
    let count = 5;
    setInterval(() => {
      count--;
      if (count <= 0) {
        if (phase === 'inspire') {
          phase = 'expire';
          document.getElementById('instruction').textContent = 'Expire';
        } else {
          phase = 'inspire';
          document.getElementById('instruction').textContent = 'Inspire';
        }
        count = 5;
      }
      document.getElementById('counter').textContent = count;
    }, 1000);
  </script>
</body>
</html>
