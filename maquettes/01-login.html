<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MDB — Connexion</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Be+Vietnam+Pro:wght@300;400;500;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/mdb.css">
<style>
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--ivoire); }
  .login-card { background: #fff; border-radius: var(--radius-2xl); padding: 48px 36px; width: 100%; max-width: 440px; box-shadow: var(--shadow-lg); position: relative; z-index: 1; border: 0.5px solid var(--ivoire-deep); }
  .tabs { display: flex; background: var(--ivoire-soft); border-radius: var(--radius-full); padding: 4px; gap: 4px; margin-bottom: 28px; }
  .tab { flex: 1; padding: 10px; border-radius: var(--radius-full); font-size: 12.5px; font-weight: 500; text-align: center; cursor: pointer; color: var(--texte-secondaire); transition: var(--transition); }
  .tab.on { background: #fff; color: var(--ambre); box-shadow: var(--shadow-soft); font-weight: 600; }
  .back-link { position: fixed; top: 24px; left: 24px; font-size: 12px; color: var(--texte-tertiaire); padding: 8px 14px; background: rgba(255,255,255,0.7); backdrop-filter: blur(8px); border-radius: var(--radius-full); }
</style>
</head>
<body>
  <div class="halo-ambre" style="top: -100px; right: -100px;"></div>
  <div class="halo-mauve" style="bottom: -100px; left: -80px;"></div>

  <div class="login-card">
    <div class="mdb-logo mdb-logo--md" style="margin: 0 auto 32px; display: flex;">
      <div class="mdb-orb mdb-orb--md mdb-orb--pulse">
        <div class="mdb-orb-core"></div>
      </div>
      <div class="mdb-logo-text">
        <span class="l1">Mindset </span><span class="l2">du bien-être.</span>
      </div>
    </div>

    <h1 class="mdb-h2 text-center" style="margin-bottom: 8px;">Bienvenue</h1>
    <p class="mdb-italic text-center" style="margin-bottom: 32px; font-size: 15px;">Ton espace de transformation t'attend.</p>

    <div class="tabs">
      <div class="tab on" onclick="switchTab('email', this)">Connexion email</div>
      <div class="tab" onclick="switchTab('code', this)">Code d'accès</div>
    </div>

    <div id="form-email">
      <div class="field">
        <label class="field-label">Email</label>
        <input class="field-input" type="email" placeholder="ton@email.com" />
      </div>
      <div class="field">
        <label class="field-label">Mot de passe</label>
        <input class="field-input" type="password" placeholder="••••••••" />
      </div>
      <button class="btn btn-or btn-block btn-lg">Accéder à mon espace</button>
    </div>

    <div id="form-code" style="display: none;">
      <div class="field">
        <label class="field-label">Ton code d'accès MDB</label>
        <input class="field-input field-input--code" type="text" placeholder="MDB-2026-XXXX" maxlength="13" />
        <div style="font-size: 11px; color: var(--texte-tertiaire); margin-top: 8px;">Tu as reçu ce code par email après ton inscription.</div>
      </div>
      <div class="field">
        <label class="field-label">Email</label>
        <input class="field-input" type="email" placeholder="ton@email.com" />
      </div>
      <button class="btn btn-or btn-block btn-lg">Accéder à mon espace</button>
    </div>

    <div class="text-center" style="margin-top: 28px; font-size: 13px; color: var(--texte-secondaire); line-height: 1.7;">
      Tu n'as pas encore accès ? <a style="color: var(--ambre); font-weight: 500; cursor: pointer;">Découvrir MDB</a><br>
      <span style="font-size: 11px; opacity: 0.7;">Ton espace est sécurisé et confidentiel.</span>
    </div>
  </div>

  <script>
    function switchTab(type, el) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
      el.classList.add('on');
      document.getElementById('form-email').style.display = type === 'email' ? 'block' : 'none';
      document.getElementById('form-code').style.display = type === 'code' ? 'block' : 'none';
    }
  </script>
</body>
</html>
