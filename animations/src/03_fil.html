<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>03 — Le fil (v2 aubergine)</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Be+Vietnam+Pro:wght@300;400;500;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --ivoire: #F5F0E8;
    --ivoire-profond: #EDE5D7;
    --aubergine: #3A1F2A;
    --aubergine-deep: #2A1620;
    --ambre: #C86030;
    --or: #C9A84C;
    --chartreuse: #B8C048;
    --chartreuse-light: #C8D058;
    --brun-noir: #1A1410;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 1080px;
    height: 1920px;
    background: transparent;
    overflow: hidden;
    font-family: 'Cormorant Garamond', serif;
  }
  .stage {
    position: absolute;
    inset: 0;
  }

  /* Bandeau aubergine bas — slide up */
  .wall {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 1080px;
    height: 1100px;
    background: linear-gradient(180deg, var(--aubergine) 0%, var(--aubergine-deep) 100%);
    transform: translateY(100%);
  }

  /* Ligne chartreuse en haut du bandeau */
  .top-line {
    position: absolute;
    bottom: 1100px;
    left: 0;
    width: 0;
    height: 3px;
    background: var(--chartreuse);
    box-shadow: 0 0 12px rgba(184, 192, 72, 0.5);
  }

  /* Petit cartouche numéroté en haut à gauche du bandeau */
  .marker {
    position: absolute;
    bottom: 1030px;
    left: 80px;
    color: var(--chartreuse);
    font-family: 'Be Vietnam Pro', sans-serif;
    font-weight: 500;
    font-size: 22px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    opacity: 0;
  }
  .marker .dot {
    color: var(--ivoire);
    margin: 0 14px;
  }

  /* Citation */
  .citation {
    position: absolute;
    bottom: 540px;
    left: 80px;
    width: 920px;
    color: var(--ivoire);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 86px;
    line-height: 1.12;
    letter-spacing: -1px;
  }
  .citation .quote-mark {
    color: var(--chartreuse);
    font-style: normal;
    font-weight: 400;
    font-size: 100px;
    line-height: 0;
    vertical-align: -10px;
    display: inline-block;
    opacity: 0;
    margin-right: 4px;
  }
  .citation .word {
    display: inline-block;
    opacity: 0;
    transform: translateY(18px);
    white-space: pre;
  }
  .citation .em {
    color: var(--chartreuse);
    font-weight: 500;
  }

  /* "Un fil." dominant — off-center, asymétrique */
  .un-fil {
    position: absolute;
    bottom: 200px;
    left: 80px;
    color: var(--ivoire);
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-style: italic;
    font-size: 220px;
    line-height: 0.95;
    letter-spacing: -6px;
    opacity: 0;
    transform: translateX(-24px);
  }
  .un-fil .point {
    color: var(--chartreuse);
    font-size: 220px;
  }

  /* Petit indicateur bottom-right */
  .footer-mark {
    position: absolute;
    bottom: 80px;
    right: 80px;
    color: var(--ivoire);
    opacity: 0.55;
    font-family: 'Be Vietnam Pro', sans-serif;
    font-weight: 400;
    font-size: 18px;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    opacity: 0;
  }

  /* Le fil chartreuse — sur la gauche, vertical */
  .fil {
    position: absolute;
    bottom: 200px;
    left: 40px;
    width: 3px;
    height: 0;
    background: linear-gradient(180deg,
      rgba(184, 192, 72, 0) 0%,
      var(--chartreuse) 12%,
      var(--chartreuse-light) 50%,
      var(--chartreuse) 88%,
      rgba(184, 192, 72, 0) 100%);
    box-shadow: 0 0 10px rgba(184, 192, 72, 0.7),
                0 0 20px rgba(184, 192, 72, 0.3);
    transform-origin: bottom center;
  }

  /* Goutte qui pend du fil */
  .fil-drop {
    position: absolute;
    bottom: 180px;
    left: 36px;
    width: 11px;
    height: 11px;
    background: var(--chartreuse);
    border-radius: 50%;
    box-shadow: 0 0 14px rgba(184, 192, 72, 0.8);
    opacity: 0;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="wall" id="wall"></div>
  <div class="top-line" id="topLine"></div>
  <div class="marker" id="marker"><span>FIL</span><span class="dot">·</span><span>01</span></div>

  <div class="fil" id="fil"></div>
  <div class="fil-drop" id="filDrop"></div>

  <div class="citation" id="citation"><span class="quote-mark" id="qOpen">«</span><span class="word" data-i="0">J'ai</span><span class="word" data-i="1"> l'impression</span><span class="word" data-i="2"> que</span><span class="word" data-i="3"> je</span><span class="word" data-i="4"> tiens</span><br><span class="word em" data-i="5">avec</span><span class="word em" data-i="6"> un</span><span class="word em" data-i="7"> fil.</span><span class="quote-mark" id="qClose"> »</span></div>

  <div class="un-fil" id="unFil">Un fil<span class="point">.</span></div>

  <div class="footer-mark" id="footerMark">Mindset · du bien-être</div>
</div>

<script>
  const FPS = 60;
  const DURATION = 5.0;
  const TOTAL_FRAMES = Math.round(FPS * DURATION);

  // Timeline
  // 0.00–0.50 : wall slides up
  // 0.45–0.80 : top-line shoots left → right
  // 0.50–0.80 : marker "FIL · 01" appears
  // 0.70–2.30 : citation words appear
  // 0.70–0.95 : quote ouvrant
  // 1.90–2.20 : quote fermant
  // 1.30–2.50 : fil chartreuse descend (height grow from top)
  // 2.50–2.90 : fil-drop apparaît
  // 2.50–3.30 : "Un fil." en grand, slide from left
  // 3.50–4.00 : footer mark
  // 4.00–5.00 : hold + très subtle micro-vibration fil

  const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
  const easeOutQuart = t => 1 - Math.pow(1 - t, 4);
  const easeInOutQuad = t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;
  const easeOutBack = t => { const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); };
  const clamp01 = v => Math.max(0, Math.min(1, v));

  function renderFrame(frame) {
    const t = frame / FPS;

    // Wall slide up
    const wallT = clamp01((t - 0.0) / 0.50);
    const wallY = (1 - easeOutQuart(wallT)) * 100;
    document.getElementById('wall').style.transform = `translateY(${wallY}%)`;

    // Top line
    const tlT = clamp01((t - 0.45) / 0.35);
    document.getElementById('topLine').style.width = (easeOutCubic(tlT) * 1080) + 'px';

    // Marker
    const mkT = clamp01((t - 0.50) / 0.30);
    document.getElementById('marker').style.opacity = easeOutCubic(mkT);

    // Quote marks
    document.getElementById('qOpen').style.opacity = easeOutCubic(clamp01((t - 0.70) / 0.25));
    document.getElementById('qClose').style.opacity = easeOutCubic(clamp01((t - 1.90) / 0.30));

    // Words
    const words = document.querySelectorAll('.citation .word');
    words.forEach((w, i) => {
      const start = 0.78 + i * 0.16;
      const dur = 0.40;
      const wt = clamp01((t - start) / dur);
      const eased = easeOutCubic(wt);
      w.style.opacity = eased;
      w.style.transform = `translateY(${(1 - eased) * 18}px)`;
    });

    // Fil descend (height grow from top)
    const filT = clamp01((t - 1.30) / 1.20);
    const filHeight = easeInOutQuad(filT) * 380;
    const filEl = document.getElementById('fil');
    filEl.style.height = filHeight + 'px';
    filEl.style.bottom = (200 + 380 - filHeight) + 'px'; // grows downward visually

    // Micro-vibration
    let dx = 0;
    if (t > 2.50) {
      const vibT = t - 2.50;
      const decay = Math.max(0.3, 1 - vibT * 0.20);
      dx = (Math.sin(vibT * 16) * 1.6 + Math.sin(vibT * 6.8) * 0.9) * decay;
    }
    filEl.style.transform = `translateX(${dx}px)`;

    // Fil drop
    const dropT = clamp01((t - 2.50) / 0.40);
    const dropEased = easeOutBack(dropT);
    document.getElementById('filDrop').style.opacity = clamp01(dropT);
    document.getElementById('filDrop').style.transform = `translateX(${dx}px) scale(${dropEased})`;

    // Un fil
    const ufT = clamp01((t - 2.50) / 0.80);
    const ufEased = easeOutBack(ufT);
    const ufEl = document.getElementById('unFil');
    ufEl.style.opacity = clamp01((t - 2.50) / 0.40);
    ufEl.style.transform = `translateX(${(1 - ufEased) * -24}px)`;

    // Footer mark
    document.getElementById('footerMark').style.opacity = clamp01((t - 3.50) / 0.50) * 0.55;
  }

  window.renderFrame = renderFrame;
  window.TOTAL_FRAMES = TOTAL_FRAMES;
  window.FPS = FPS;
  renderFrame(0);
</script>
</body>
</html>
