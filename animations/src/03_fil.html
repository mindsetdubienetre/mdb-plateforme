<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>03 — Le fil (v3 minimaliste)</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --ivoire: #F5F0E8;
    --ivoire-profond: #EDE5D7;
    --aubergine: #3A1F2A;
    --mauve: #9A8090;
    --mauve-deep: #5A4555;
    --chartreuse: #B8C048;
    --chartreuse-light: #C8D058;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 1080px;
    height: 1920px;
    background: transparent;
    overflow: hidden;
    font-family: 'Cormorant Garamond', serif;
  }
  .stage {
    position: absolute;
    inset: 0;
  }

  /* Gradient mauve très doux, du bas vers le milieu — uniquement pour
     darken la zone texte et garder lisibilité. Le visage reste totalement libre. */
  .vignette {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 1080px;
    height: 1100px;
    background: linear-gradient(180deg,
      rgba(58, 31, 42, 0) 0%,
      rgba(58, 31, 42, 0.18) 25%,
      rgba(90, 69, 85, 0.55) 60%,
      rgba(58, 31, 42, 0.78) 100%);
    opacity: 0;
  }

  /* Citation */
  .citation {
    position: absolute;
    bottom: 540px;
    left: 80px;
    width: 920px;
    color: var(--ivoire);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 86px;
    line-height: 1.12;
    letter-spacing: -1px;
    text-shadow: 0 2px 24px rgba(26, 20, 16, 0.6);
  }
  .citation .quote-mark {
    color: var(--chartreuse);
    font-style: normal;
    font-weight: 400;
    font-size: 100px;
    line-height: 0;
    vertical-align: -10px;
    display: inline-block;
    opacity: 0;
    margin-right: 4px;
  }
  .citation .word {
    display: inline-block;
    opacity: 0;
    transform: translateY(18px);
    white-space: pre;
  }
  .citation .em {
    color: var(--chartreuse);
    font-weight: 500;
  }

  /* "Un fil." dominant */
  .un-fil {
    position: absolute;
    bottom: 200px;
    left: 80px;
    color: var(--ivoire);
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-style: italic;
    font-size: 220px;
    line-height: 0.95;
    letter-spacing: -6px;
    opacity: 0;
    transform: translateX(-24px);
    text-shadow: 0 4px 30px rgba(26, 20, 16, 0.7);
  }
  .un-fil .point {
    color: var(--chartreuse);
  }

  /* Le fil chartreuse vertical à gauche */
  .fil {
    position: absolute;
    bottom: 200px;
    left: 40px;
    width: 3px;
    height: 0;
    background: linear-gradient(180deg,
      rgba(184, 192, 72, 0) 0%,
      var(--chartreuse) 12%,
      var(--chartreuse-light) 50%,
      var(--chartreuse) 88%,
      rgba(184, 192, 72, 0) 100%);
    box-shadow: 0 0 10px rgba(184, 192, 72, 0.7),
                0 0 20px rgba(184, 192, 72, 0.3);
    transform-origin: bottom center;
  }

  /* Goutte au bout du fil */
  .fil-drop {
    position: absolute;
    bottom: 180px;
    left: 36px;
    width: 11px;
    height: 11px;
    background: var(--chartreuse);
    border-radius: 50%;
    box-shadow: 0 0 14px rgba(184, 192, 72, 0.8);
    opacity: 0;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="vignette" id="vignette"></div>

  <div class="fil" id="fil"></div>
  <div class="fil-drop" id="filDrop"></div>

  <div class="citation" id="citation"><span class="quote-mark" id="qOpen">«</span><span class="word" data-i="0">J'ai</span><span class="word" data-i="1"> l'impression</span><span class="word" data-i="2"> que</span><span class="word" data-i="3"> je</span><span class="word" data-i="4"> tiens</span><br><span class="word em" data-i="5">avec</span><span class="word em" data-i="6"> un</span><span class="word em" data-i="7"> fil.</span><span class="quote-mark" id="qClose"> »</span></div>

  <div class="un-fil" id="unFil">Un fil<span class="point">.</span></div>
</div>

<script>
  const FPS = 60;
  const DURATION = 5.0;
  const TOTAL_FRAMES = Math.round(FPS * DURATION);

  const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
  const easeOutQuart = t => 1 - Math.pow(1 - t, 4);
  const easeInOutQuad = t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;
  const easeOutBack = t => { const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); };
  const clamp01 = v => Math.max(0, Math.min(1, v));

  function renderFrame(frame) {
    const t = frame / FPS;

    // Vignette fade
    document.getElementById('vignette').style.opacity = easeOutCubic(clamp01((t - 0.0) / 0.55));

    // Quotes
    document.getElementById('qOpen').style.opacity = easeOutCubic(clamp01((t - 0.55) / 0.25));
    document.getElementById('qClose').style.opacity = easeOutCubic(clamp01((t - 1.85) / 0.30));

    // Words
    document.querySelectorAll('.citation .word').forEach((w, i) => {
      const start = 0.65 + i * 0.16;
      const wt = clamp01((t - start) / 0.40);
      const eased = easeOutCubic(wt);
      w.style.opacity = eased;
      w.style.transform = `translateY(${(1 - eased) * 18}px)`;
    });

    // Fil descend
    const filT = clamp01((t - 1.20) / 1.20);
    const filHeight = easeInOutQuad(filT) * 380;
    const filEl = document.getElementById('fil');
    filEl.style.height = filHeight + 'px';
    filEl.style.bottom = (200 + 380 - filHeight) + 'px';

    // Vibration
    let dx = 0;
    if (t > 2.40) {
      const vibT = t - 2.40;
      const decay = Math.max(0.3, 1 - vibT * 0.20);
      dx = (Math.sin(vibT * 16) * 1.6 + Math.sin(vibT * 6.8) * 0.9) * decay;
    }
    filEl.style.transform = `translateX(${dx}px)`;

    // Drop
    const dropT = clamp01((t - 2.40) / 0.40);
    document.getElementById('filDrop').style.opacity = clamp01(dropT);
    document.getElementById('filDrop').style.transform = `translateX(${dx}px) scale(${easeOutBack(dropT)})`;

    // Un fil
    const ufT = clamp01((t - 2.40) / 0.80);
    const ufEased = easeOutBack(ufT);
    const ufEl = document.getElementById('unFil');
    ufEl.style.opacity = clamp01((t - 2.40) / 0.40);
    ufEl.style.transform = `translateX(${(1 - ufEased) * -24}px)`;
  }

  window.renderFrame = renderFrame;
  window.TOTAL_FRAMES = TOTAL_FRAMES;
  window.FPS = FPS;
  renderFrame(0);
</script>
</body>
</html>
